<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Wordburn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>window.GamePixConfig = { lifecycle: "manual" };</script>
<script src="https://integration.gamepix.com/sdk/v3/gamepix.sdk.js"></script>
<script src="lib/pixi.min.js"></script>
<style>
/* Layout: palco fisso scalato sullo schermo. Orizzontale 1920x1080: pannello sinistro (punti, catena, parole), centro (parola + griglia), pannello destro (tempo, obiettivo, punti per lunghezza, legenda, aiuto). Verticale largo 1080: colonna unica, l'altezza in più va alle parole trovate. */
@font-face{font-family:"Alfa Slab One";src:url("fonts/AlfaSlabOne-Regular.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Lilita One";src:url("fonts/LilitaOne-Regular.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Figtree";src:url("fonts/Figtree-Variable.ttf") format("truetype");font-weight:300 900;font-display:swap}
:root{
  --panel:#FAF3E0; --panel-edge:#D6C7B2; --white:#ffffff;
  --tray:rgba(16,42,67,.86); --tray-edge:#081a2b;
  --ink:#102A43; --muted:#5b6b7d;
  --cream:#FAF3E0; --cream-edge:#D6C7B2;
  --u1:#FEF3C7; --u1-edge:#E9B949; --gold:#FACC15;
  --orange:#FACC15; --orange-edge:#b8860b;
  --red:#F43F5E; --red-edge:#9f1239; --red-ink:#ffffff;
  --sel:#FACC15; --sel-edge:#b8860b; --trail:#FACC15;
  --bolt:#10B981; --bolt-edge:#047857; --bolt-ring:#6ee7b7;
  --ice:#d3ecfa; --ice-edge:#8cc4ec; --ice-ink:#3c6f96;
  --accent:#8B5CF6; --accent-edge:#5b21b6; --good:#10B981; --good-edge:#047857; --bad:#F43F5E; --teal:#00A8CC;
  --scrim:rgba(6,14,26,.62);
  --f-display:"Lilita One","Alfa Slab One","Arial Rounded MT Bold",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
@media (max-aspect-ratio:1/1){body{background-image:var(--bgimgp,var(--bgimg,none))!important}}
body{background:#0d1a29 var(--bgimg,none) center/cover no-repeat;color:var(--ink);font-family:var(--f-body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible{outline:4px solid var(--sel);outline-offset:3px}
#vp{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#holder{position:relative;width:100%;height:100%}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;display:grid;touch-action:none}

/* ---------- elementi comuni (unità = pixel del palco) ---------- */
.lbl{font-size:24px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.num{font-family:var(--f-display);line-height:1;font-variant-numeric:tabular-nums}
hr{border:0;border-top:2px solid var(--panel-edge);margin:0}
.logo{display:block;width:100%;height:auto;padding:6px 10px 2px;border-radius:20px;background:radial-gradient(ellipse at 50% 65%,#24384f,#0d1a29 75%);box-shadow:inset 0 0 0 3px rgba(250,204,21,.35)}
.blk-row{display:flex;justify-content:space-between;align-items:flex-end}
.blk-row>div:last-child{text-align:right}
#hudLevel,#hudBest{font-size:46px}
#hudScore{font-size:96px}
.mult-blk{display:flex;align-items:center;gap:18px}
.ring{--p:0;width:104px;height:104px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1turn),var(--panel-edge) 0)}
.ring b{width:82px;height:82px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--f-display);font-weight:400;font-size:32px;color:var(--muted)}
.ring.hot b{color:var(--accent)}
.ring.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.12)}}
.mult-txt{font-size:26px;line-height:1.3;color:var(--muted)}
.mult-txt strong{color:var(--ink);display:block}
.found{display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px;overflow:hidden;min-height:0}
.chip{background:var(--white);border:2px solid var(--panel-edge);border-radius:999px;padding:6px 16px;font-weight:800;font-size:26px;letter-spacing:.04em;white-space:nowrap}
.chip i{font-style:normal;color:var(--accent);margin-left:8px}
.chip.new{animation:chipIn .35s ease-out}
@keyframes chipIn{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}

.wordbar{position:relative;height:100px;border-radius:24px;background:var(--panel);border:2px solid var(--panel-edge);display:flex;align-items:center;justify-content:center;gap:18px;overflow:hidden;
  font-family:var(--f-display);font-size:58px;letter-spacing:.1em;color:var(--ink);white-space:nowrap;transition:background .15s,color .15s}
.wordbar small{font-family:var(--f-body);font-weight:800;font-size:26px;letter-spacing:0;color:var(--muted)}
.wordbar.ok{background:var(--good);border-color:var(--good);color:#fff}.wordbar.ok small{color:#e5fff0}
.wordbar.bad{background:var(--bad);border-color:var(--bad);color:#fff}.wordbar.bad small{color:#ffe3dc}
.wordbar.dup{background:var(--orange);border-color:var(--orange);color:var(--ink)}.wordbar.dup small{color:var(--ink)}
.wordbar.tip{font-family:var(--f-body);font-weight:800;font-size:34px;letter-spacing:0;color:var(--ink);background:var(--white)}

.board{position:relative;background:var(--tray);border-radius:34px;box-shadow:0 0 0 5px rgba(250,204,21,.6),inset 0 -10px 0 var(--tray-edge),0 24px 60px rgba(0,0,0,.55)}
.cells{display:grid;grid-template-columns:repeat(5,1fr);width:100%;height:100%}
.cell{position:relative;border-radius:22%;display:grid;place-items:center;font-family:var(--f-display);
  background:var(--cream);color:var(--ink);box-shadow:0 9px 0 var(--cream-edge),0 14px 16px rgba(0,0,0,.35);transition:transform .08s,background .15s,color .15s;margin-bottom:9px}
.cell.u1{background:var(--u1);box-shadow:inset 0 0 0 6px var(--gold),0 9px 0 var(--u1-edge),0 14px 16px rgba(0,0,0,.35)}
.cell.u1::before{content:"";position:absolute;left:50%;bottom:7%;width:10%;height:10%;transform:translateX(-50%);border-radius:50%;background:var(--u1-edge)}
.cell.u2{background:linear-gradient(160deg,#fb7185,var(--red));color:var(--red-ink);box-shadow:0 9px 0 var(--red-edge),0 14px 16px rgba(0,0,0,.4);opacity:.92;text-shadow:0 3px 0 rgba(120,10,30,.4)}
.cell.u2::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,.13) 14px 19px)}
.cell.on{background:#fff;color:var(--ink);box-shadow:0 9px 0 var(--cream-edge),0 0 0 7px var(--gold),0 0 34px rgba(250,204,21,.9);transform:translateY(-6px) scale(1.05);z-index:1}
.cell.on::before,.cell.on::after{display:none}
.cell.bolt{background:linear-gradient(160deg,#34d399,var(--bolt));color:#fff;box-shadow:0 9px 0 var(--bolt-edge),0 0 0 6px var(--bolt-ring),0 0 30px rgba(16,185,129,.8)}
.cell.frozen{background:var(--ice);color:var(--ice-ink);box-shadow:inset 0 0 0 6px var(--ice-edge),0 9px 0 #8cb4d4}
.cell.thaw{box-shadow:0 9px 0 var(--cream-edge),0 0 0 5px var(--ice-edge)}
.cell .tag{position:absolute;right:14px;top:10px;font-family:var(--f-body);font-weight:900;font-size:26px;line-height:1}
.cell .ico{position:absolute;left:14px;top:9px;font-family:var(--f-body);font-size:26px;line-height:1}
.cell.hinted{animation:hintPulse 1s infinite}
@keyframes hintPulse{50%{box-shadow:0 9px 0 var(--cream-edge),0 0 0 9px var(--teal),0 0 30px var(--teal)}}
.board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.board polyline{fill:none;stroke:var(--trail);stroke-linecap:round;stroke-linejoin:round;opacity:.8;filter:drop-shadow(0 0 6px var(--trail))}
[data-trail="rainbow"] .board svg{animation:hue 1.6s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}

#hudTime{font-size:116px}
#hudTime.low{color:var(--bad)}
.time-wrap{position:relative;display:inline-block}
.tbonus{position:absolute;left:100%;top:4px;margin-left:10px;font-family:var(--f-body);font-weight:900;font-size:34px;color:var(--good);white-space:nowrap;opacity:0;pointer-events:none}
.tbonus.show{animation:tb 1.2s ease-out}
@keyframes tb{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.bar{height:16px;border-radius:8px;background:var(--panel-edge);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--accent);border-radius:8px;transform-origin:left}
.bar.low i{background:var(--bad)}
.goal{font-size:30px;font-weight:800}
.goal b{font-family:var(--f-display);font-weight:400;font-size:44px}
.goal.done b{color:var(--good)}
.mgrid .seg{grid-column:1/-1}
.goal small{font-size:.75em;color:var(--gold);text-shadow:0 1px 0 #b8860b}
.gridinfo{font-size:24px;color:var(--muted);font-weight:600;margin-top:4px}
.gridinfo b{color:var(--ink)}
.pts{display:grid}
.pt{display:flex;justify-content:space-between;align-items:baseline}
.pt span{font-weight:600}
.pt b{font-family:var(--f-display);font-weight:400}
.pt.hl{color:var(--accent)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:24px;font-weight:700}
.legend span{display:flex;align-items:center;gap:10px}
.sw{width:30px;height:30px;border-radius:8px;flex:none;display:inline-block}
.actions{display:flex;gap:14px}
.btn{flex:1;background:var(--accent);color:#fff;font-weight:900;font-size:30px;border-radius:20px;padding:18px 14px;box-shadow:inset 0 -7px 0 var(--accent-edge)}
.btn:disabled{background:var(--panel-edge);color:var(--muted);box-shadow:none;cursor:default}
.btn.go{background:var(--good);box-shadow:inset 0 -7px 0 var(--good-edge)}
.icon-btn{width:76px;height:76px;border-radius:50%;background:var(--panel);border:2px solid var(--panel-edge);display:grid;place-items:center;font-size:28px;font-weight:900;color:var(--ink)}

/* ---------- orizzontale ---------- */
#stage.land{width:1920px;height:1080px;grid-template-columns:400px 1fr 400px;column-gap:40px;padding:48px 56px}
.land .panel{background:var(--panel);border:0;box-shadow:0 10px 0 var(--panel-edge),0 22px 40px rgba(0,0,0,.45);border-radius:28px;padding:28px 30px;display:flex;flex-direction:column;gap:14px;min-height:0;position:relative}
.land .center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.land .wordbar{width:860px}
.land .board{width:820px;height:820px;padding:22px}
.land .cells{gap:16px}
.land .cell{font-size:86px}
.land .found{flex:1}
.land .pt{font-size:26px;padding:2px 0;border-bottom:1px solid var(--panel-edge)}
.land .pt b{font-size:28px}
.land #actions{margin-top:auto}
.land #hudTime{font-size:104px}
.land #btnPause{position:absolute;right:24px;top:24px}
.land .mult-blk{min-height:104px}

/* ---------- verticale ---------- */
#stage.port{width:1080px;padding:36px 40px;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:20px;row-gap:22px;
  grid-template-areas:"lvl time score" "bar bar bar" "goal goal pause" "word word mult" "board board board" "act act act" "pts pts pts" "found found found";
  grid-template-rows:repeat(8,auto);align-content:center}
.port .panel,.port .center{display:contents}
#stage.port{background:linear-gradient(rgba(6,14,26,.35),rgba(6,14,26,.55))}
.port .lbl{color:#cfe0f0}.port .num{color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.port .goal,.port .gridinfo,.port .gridinfo b{color:#fff}.port .gridinfo{color:#cfe0f0}
.port .ring b{background:var(--panel)}
.port .only-land{display:none!important}
.port #blkLevel{grid-area:lvl}
.port #blkScore{grid-area:score;text-align:right}
.port #blkTime{grid-area:time;text-align:center}
.port #timeBar{grid-area:bar}
.port #blkGoal{grid-area:goal}
.port #btnPause{grid-area:pause;justify-self:end;align-self:center}
.port #wordbar{grid-area:word}
.port #blkMult{grid-area:mult;justify-self:end}
.port #board{grid-area:board;width:1000px;height:1000px;padding:24px}
.port .cells{gap:20px}
.port .cell{font-size:108px}
.port #actions{grid-area:act}
#stage.compact .no-compact,#stage.compact #ptsTable,#stage.compact #legend{display:none!important}
#stage.compact .chip{font-size:30px}
.port #ptsTable{grid-area:pts;grid-template-columns:repeat(8,1fr);gap:10px}
.port .pt{flex-direction:column;align-items:center;background:var(--panel);border:2px solid var(--panel-edge);border-radius:16px;padding:8px 4px;font-size:26px}
.port .pt span{font-size:30px;color:var(--muted)}
.port .pt b{font-size:34px}
.port .pt.hl{background:var(--sel);border-color:var(--sel);color:var(--ink)}.port .pt.hl span{color:var(--ink)}
.port #found{grid-area:found;min-height:150px;max-height:260px}
.port .lbl{font-size:30px}
.port #hudLevel,.port #hudScore{font-size:64px}
.port #hudTime{font-size:120px}
.port .mult-txt{display:none}
.port .ring{width:100px;height:100px}
.port .wordbar{height:100px;font-size:56px}
.port .goal{font-size:34px}
.port .gridinfo{font-size:32px}
.port .wordbar small{font-size:32px}
.port .chip{font-size:30px}
.port .btn{font-size:36px;padding:22px}
.port .tbonus{font-size:40px}

/* ---------- schermate sopra il gioco (non scalate) ---------- */
.screen{position:fixed;inset:0;z-index:5;background:var(--scrim);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:520px;max-height:100%;overflow-y:auto;background:var(--panel);border:0;box-shadow:0 8px 0 var(--panel-edge),0 20px 50px rgba(0,0,0,.5);border-radius:26px;padding:26px;display:flex;flex-direction:column;gap:16px;color:var(--ink);
  font-size:clamp(15px,2.2vmin,18px)}
.card h1,.card h2{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.05;text-wrap:balance}
.card h2{font-size:clamp(26px,5vmin,36px)}
.card p{margin:0;line-height:1.5;color:var(--muted)}
.card p b{color:var(--ink)}
.tiles{display:flex;gap:min(6px,1.2vw);flex-wrap:nowrap}
.tiles span{flex:1;max-width:52px;aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-size:clamp(20px,4vmin,30px);
  background:var(--cream);color:var(--ink);box-shadow:inset 0 -4px 0 var(--cream-edge)}
.tiles span.o{background:var(--orange);box-shadow:inset 0 -4px 0 var(--orange-edge)}
.tiles span.r{background:var(--red);color:var(--red-ink);box-shadow:inset 0 -4px 0 var(--red-edge)}
.cbtn{background:var(--accent);color:#fff;font-weight:900;font-size:clamp(17px,2.6vmin,21px);border-radius:16px;padding:15px 18px;box-shadow:inset 0 -5px 0 var(--accent-edge)}
.cbtn.green{background:var(--good);box-shadow:inset 0 -5px 0 var(--good-edge)}
.cbtn.gold{background:var(--gold);color:var(--ink);box-shadow:inset 0 -5px 0 var(--sel-edge)}
.cbtn:disabled{opacity:.55;cursor:default}
.cbtn.big{font-size:clamp(20px,3.4vmin,26px);padding:18px}
.cbtn.ghost{background:var(--white);color:var(--ink);border:2px solid var(--panel-edge);box-shadow:none}
.cbtn.video{background:var(--good);box-shadow:inset 0 -5px 0 var(--good-edge)}
.cbtn.video::before{content:"▶";display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:rgba(255,255,255,.25);margin-right:10px;font-size:.75em;vertical-align:middle}
.crow{display:flex;gap:10px;flex-wrap:wrap}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.crow>*{flex:1}
.bignum{font-family:var(--f-display);font-size:clamp(30px,6vmin,44px);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{font-size:14px;padding:3px 10px;border-width:1px;color:var(--muted)}
.seg{display:flex;background:var(--white);border:2px solid var(--panel-edge);border-radius:999px;padding:3px}
.seg button{flex:1;padding:8px 12px;border-radius:999px;font-weight:900;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.howto{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.howto li{display:flex;gap:12px;align-items:center;line-height:1.35}
.howto .sw{width:26px;height:26px}
.loading{text-align:center}
.loading .bar{height:10px}
#fx{position:fixed;inset:0;z-index:3;pointer-events:none}
#amb{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
#vp{z-index:1}
#hand{position:fixed;z-index:4;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;pointer-events:none;
  background:rgba(255,255,255,.55);border:5px solid var(--teal);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.menu-logo{width:100%;height:auto;padding:8px 14px 2px;border-radius:20px;background:radial-gradient(ellipse at 50% 65%,#24384f,#0d1a29 75%);box-shadow:inset 0 0 0 3px rgba(250,204,21,.35)}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.coins{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:clamp(20px,3.4vmin,26px);color:var(--ink);background:var(--white);border-radius:999px;padding:4px 14px 4px 6px;box-shadow:0 3px 0 var(--panel-edge)}
.coins::before{content:"";width:1.05em;height:1.05em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,var(--gold) 45%,#d99a06);box-shadow:inset 0 0 0 2px #b8860b}
.gift{font-weight:900;background:var(--gold);color:var(--ink);border-radius:999px;padding:8px 16px;box-shadow:0 4px 0 var(--sel-edge);position:relative}
.gift.dot::after{content:"";position:absolute;right:-3px;top:-3px;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid #fff}
.gift.done{background:var(--white);box-shadow:0 3px 0 var(--panel-edge);color:var(--muted)}
.stars{font-size:clamp(34px,7vmin,52px);letter-spacing:.1em;color:var(--gold);text-shadow:0 3px 0 var(--sel-edge);line-height:1;text-align:center}
.stars i{font-style:normal;color:var(--panel-edge);text-shadow:none}
.coinline{font-family:var(--f-display);font-size:clamp(20px,3.6vmin,26px);color:#b8860b}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days span{display:grid;place-items:center;aspect-ratio:1;border-radius:12px;background:var(--white);font-weight:900;font-size:clamp(11px,2vmin,14px);color:var(--muted);box-shadow:0 3px 0 var(--panel-edge);text-align:center;line-height:1.1}
.days span.past{background:var(--u1);color:#8a6400}
.days span.now{background:var(--gold);color:var(--ink);box-shadow:0 3px 0 var(--sel-edge);transform:scale(1.08)}
.shop{max-width:640px}
.shop-head{display:flex;justify-content:space-between;align-items:center}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.item{background:var(--white);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 0 var(--panel-edge)}
.item.on{box-shadow:0 0 0 4px var(--gold),0 4px 0 var(--sel-edge)}
.item b{font-weight:900}
.pv{height:clamp(56px,11vmin,80px);border-radius:12px;overflow:hidden;display:flex;gap:6px;align-items:center;justify-content:center;background:#16263a}
.pv .cell{width:28%;aspect-ratio:1;font-size:clamp(18px,3.6vmin,28px);margin:0 0 6px;box-shadow:0 5px 0 var(--cream-edge)}
.pv .cell.u1{box-shadow:inset 0 0 0 4px var(--gold),0 5px 0 var(--u1-edge)}.pv .cell.u2{box-shadow:0 5px 0 var(--red-edge)}
.pv img{width:100%;height:100%;object-fit:cover}
.pv svg{width:90%;height:70%;overflow:visible}
.item .cbtn{padding:10px;font-size:clamp(14px,2.2vmin,17px)}
/* skin tessere */
[data-tiles="wood"] .cell{background:url("assets/wood0.webp") center/100% 100% no-repeat;box-shadow:none;color:#3b2414;filter:drop-shadow(0 6px 5px rgba(0,0,0,.45));padding-bottom:3%}
[data-tiles="wood"] .cell.u1{background-image:url("assets/wood1.webp");box-shadow:none;color:#4a2706}

const Wallet = {

    this.coins = Save.get("coins", 0);

      const ids = CONFIG.shop[cat].map(x => x.id);
      this.owned[cat] = [...new Set([ids[0], ...((o[cat] || []).filter(id => ids.includes(id)))])];
      this.equip[cat] = this.owned[cat].includes(e[cat]) ? e[cat] : ids[0];

    applySkins();

  add(n) { if (!n) return; this.coins += n; Save.set("coins", this.coins); renderCoins(); },
  owns(cat, id) { return this.owned[cat].includes(id); },

    const it = CONFIG.shop[cat].find(x => x.id === id);
    if (!it || this.owns(cat, id) || this.coins < it.price) return false;
    this.coins -= it.price; this.owned[cat].push(id);
    Save.set("coins", this.coins); Save.set("owned", this.owned); this.use(cat, id); renderCoins(); return true;
  },
  use(cat, id) { if (!this.owns(cat, id)) return; this.equip[cat] = id; Save.set("equip", this.equip); applySkins(); }

const NB = [];

    for (const j of NB[i]) if (!path.includes(j)) dfs(j, n, s);

function loop(now) {
  const fdt = Math.min(.1, (now - (loop.prev || now)) / 1000); loop.prev = now;
  stepShake(fdt); if (!FX.low || fpsFrames % 2 === 0) Amb.frame(FX.low ? fdt * 2 : fdt);
  // effetti ridotti da soli se per 3 secondi si scende sotto i 40 fps
  fpsFrames++; if (now - fpsT >= 1000) { const fps = fpsFrames * 1000 / (now - fpsT); fpsFrames = 0; fpsT = now; fpsSlow = fps < 40 && G.state === "play" ? fpsSlow + 1 : 0; if (fpsSlow >= 3 && !FX.low) FX.setLow(true); }
  if (G.state === "play") {
    const dt = Math.min(.25, (now - G.lastTick) / 1000);
    if (G.mode === "zen" && !G.tutorial) {
      G.clock += dt; const s = Math.floor(G.clock);
      if (s !== G.lastSecond) { G.lastSecond = s; renderHint(); }
      renderMult(); updateSpecials(dt);
    } else if (!G.tutorial) {   // durante il tutorial il tempo è fermo finché non trovi la prima parola
      G.clock += dt; G.timeLeft -= dt;
      const s = Math.ceil(G.timeLeft);
      if (s !== G.lastSecond) { G.lastSecond = s; if (s <= 5 && s > 0) Sound.tick(); renderHud(); renderHint(); }
      else $("timeFill").style.transform = `scaleX(${Math.max(0, G.timeLeft / G.barMax)})`;
      renderMult(); updateSpecials(dt);
      if (G.timeLeft <= 0) { G.timeLeft = 0; renderHud(); endLevel(); }
    }
  }
  G.lastTick = now;
  requestAnimationFrame(loop);
}

/* ---------- menu e lingua ---------- */
function renderMenu() {
  renderCoins();
  const gs = Gift.state(), gb = $("btnGift");
  gb.textContent = gs.claimed ? TEXTS.giftBtnDone(gs.n) : TEXTS.giftBtn; gb.className = "gift" + (gs.claimed ? " done" : " dot");
  $("btnZen").textContent = TEXTS.zenBtn(Save.get("zen." + LANG, 1));
  const d = Save.get("daily." + LANG, {});
  $("btnDaily").textContent = d.date === todayKey() ? TEXTS.dailyBtnDone(d.best) : TEXTS.dailyBtn;
  $("btnShop").textContent = TEXTS.shop;
  $("menuTag").textContent = TEXTS.tag;
  $("menuBest").innerHTML = TEXTS.best(G.best); $("menuBest").hidden = !G.best;
  $("btnPlay").textContent = TEXTS.play; $("btnHow").textContent = TEXTS.how;
  $("btnMute").textContent = $("btnMute2").textContent = Sound.muted ? TEXTS.soundOff : TEXTS.soundOn;
  $("btnMusic").textContent = $("btnMusic2").textContent = Sound.musicOn ? TEXTS.musicOn : TEXTS.musicOff;
  $("btnIt").setAttribute("aria-pressed", LANG === "it"); $("btnEn").setAttribute("aria-pressed", LANG === "en");
}
function renderHow() {
  const sw = { sel: "var(--sel)", o: "var(--u1);box-shadow:inset 0 0 0 3px var(--gold)", r: "var(--red)", acc: "var(--accent)", zen: "var(--good)", bolt: "var(--bolt)", ice: "var(--ice)" };
  $("howTitle").textContent = TEXTS.howTitle; $("btnHowClose").textContent = TEXTS.close;
  $("howList").innerHTML = TEXTS.howList.map(([k, t]) => `<li><i class="sw" style="background:${sw[k]}"></i><span>${t}</span></li>`).join("");
}
function applyTexts() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = TEXTS[el.dataset.t]);
  $("btnSkip").textContent = TEXTS.skip;
  $("pauseTitle").textContent = TEXTS.pauseTitle; $("pauseText").textContent = TEXTS.pauseText;
  $("btnResume").textContent = TEXTS.resume; $("btnQuit").textContent = TEXTS.quit; $("btnMenu").textContent = TEXTS.menu;
  $("btnHint").textContent = TEXTS.hintReady;
  buildStatic(); renderMult();
}
async function setLang(lang) {
  LANG = CONFIG.langs[lang] ? lang : CONFIG.defaultLang;
  TEXTS = TEXTS_ALL[LANG];
  G.best = Save.get("best." + LANG, 0);
  applyTexts();
  $("loadingText").textContent = TEXTS.loading; $("loadFill").style.transform = "scaleX(.1)"; setState("loading");
  await loadDict(LANG, p => $("loadFill").style.transform = `scaleX(${p})`);
  $("loadFill").style.transform = "scaleX(1)";
  const demo = makeLevelGrid(quotaFor(1));
  Object.assign(G, { grid: demo.grid, common: demo.common, valid: demo.valid, uses: demo.grid.map(() => 0), quota: quotaFor(1), found: [], foundPts: {}, hintCell: -1, level: 1, score: 0, timeLeft: timeFor(1), barMax: timeFor(1) });
  renderGrid(); renderHud(); renderMult(); renderFound(); renderPath(); flash("", "", null, 0);
  renderMenu(); setState("menu");
}
// lingua: scelta salvata, poi quella del portale, poi quella del browser se è italiano, altrimenti inglese
function initialLang() {
  const saved = Save.get("lang", null); if (saved && CONFIG.langs[saved]) return saved;
  const fromPortal = (Portal.locale() || "").slice(0, 2).toLowerCase(); if (CONFIG.langs[fromPortal]) return fromPortal;
  const nav = ((navigator.languages && navigator.languages[0]) || navigator.language || "").slice(0, 2).toLowerCase();
  return nav === "it" ? "it" : CONFIG.defaultLang;
}

/* ---------- regalo giornaliero ---------- */
function openGift() {
  const st = Gift.state(), c = Gift.amount(st.n);
  $("giftTitle").textContent = TEXTS.giftTitle;
  const pos = ((st.n - 1) % 7) + 1;
  $("giftDays").innerHTML = CONFIG.giftCoins.map((v, k) => `<span class="${k + 1 < pos ? "past" : k + 1 === pos ? "now" : ""}">${TEXTS.day(k + 1)}<br>${v}</span>`).join("");
  $("giftText").innerHTML = TEXTS.giftText(st.n, c);
  const b1 = $("btnClaim"), b2 = $("btnClaim2");
  b1.disabled = b2.disabled = st.claimed;
  b1.textContent = st.claimed ? TEXTS.giftBtnDone(st.n) : TEXTS.claim(c);
  b2.hidden = st.claimed || !Portal.canReward(); b2.textContent = TEXTS.claimDouble(c * 2);
  $("scrGift").hidden = false;
}
function afterClaim(got) { if (!got) return; $("giftText").innerHTML = `<b>${TEXTS.claimed(got)}</b>`; $("btnClaim").disabled = true; $("btnClaim2").hidden = true; FX.confetti(); Sound.end(true); renderMenu(); setTimeout(() => { $("scrGift").hidden = true; }, 1400); }
$("btnClaim").onclick = () => { Sound.unlock(); afterClaim(Gift.claim(1)); };
$("btnClaim2").onclick = async () => { Sound.unlock(); const b = $("btnClaim2"); b.disabled = true; const ok = await Portal.rewarded(); b.disabled = false; if (ok) { G.lastAdAt = performance.now() / 1000; afterClaim(Gift.claim(2)); } else { b.hidden = true; $("giftText").innerHTML += `<br><small>${TEXTS.adFail}</small>`; } };
$("scrGift").onclick = (e) => { if (e.target === $("scrGift")) $("scrGift").hidden = true; };

/* ---------- negozio ---------- */
let shopCat = "tiles";
function preview(cat, id) {
  if (cat === "tiles") return `<div class="pv" data-tiles="${id}"><div class="cell">A</div><div class="cell u1">B</div><div class="cell u2">C</div></div>`;
  if (cat === "trail") { const c = CONFIG.shop.trail.find(x => x.id === id).color;
    return `<div class="pv" data-trail="${id}"><svg viewBox="0 0 100 40"${id === "rainbow" ? ' style="animation:hue 1.6s linear infinite"' : ""}><polyline points="8,30 34,10 62,28 92,10" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 4px ${c})"/></svg></div>`; }
  return `<div class="pv"><img src="assets/bg-${id}.webp" alt="" loading="lazy"></div>`;
}
function renderShop() {
  $("shopTitle").textContent = TEXTS.shopTitle; $("btnShopClose").textContent = TEXTS.back; renderCoins();
  $("shopTabs").querySelectorAll("button").forEach(b => { b.textContent = TEXTS.tabs[b.dataset.cat]; b.setAttribute("aria-pressed", b.dataset.cat === shopCat); });
  $("shopItems").innerHTML = CONFIG.shop[shopCat].map(it => {
    const own = Wallet.owns(shopCat, it.id), on = Wallet.equip[shopCat] === it.id;
    const btn = on ? `<button class="cbtn ghost" disabled>${TEXTS.inUse}</button>`
      : own ? `<button class="cbtn" data-use="${it.id}">${TEXTS.use}</button>`
      : `<button class="cbtn gold" data-buy="${it.id}"${Wallet.coins < it.price ? " disabled" : ""}>${TEXTS.price(it.price)}</button>`;
    return `<div class="item${on ? " on" : ""}">${preview(shopCat, it.id)}<b>${TEXTS.names[it.id]}</b>${btn}</div>`;
  }).join("");
}
$("shopTabs").onclick = (e) => { const c = e.target.dataset && e.target.dataset.cat; if (c) { shopCat = c; renderShop(); } };
$("shopItems").onclick = (e) => {
  const b = e.target.closest("button"); if (!b || b.disabled) return; Sound.unlock();
  if (b.dataset.buy) { if (Wallet.buy(shopCat, b.dataset.buy)) { Sound.ok(2); FX.confetti(); } }
  else if (b.dataset.use) { Wallet.use(shopCat, b.dataset.use); Sound.step(3); }
  renderShop();
};
$("btnShop").onclick = () => { renderShop(); $("scrShop").hidden = false; };
$("btnShopClose").onclick = () => { $("scrShop").hidden = true; renderMenu(); };

/* ---------- avvio ---------- */
$("btnPlay").onclick = () => { Sound.unlock(); startGame("classic"); };
$("btnZen").onclick = () => { Sound.unlock(); startGame("zen"); };
$("btnDaily").onclick = () => { Sound.unlock(); startGame("daily"); };
$("btnGift").onclick = () => { Sound.unlock(); openGift(); };
$("btnDouble").onclick = onDouble;
$("btnMute").onclick = $("btnMute2").onclick = () => { Sound.unlock(); Sound.toggle(); renderMenu(); };
$("btnMusic").onclick = $("btnMusic2").onclick = () => { Sound.unlock(); Sound.toggleMusic(); renderMenu(); };
$("btnHow").onclick = () => { renderHow(); $("scrHow").hidden = false; };
$("btnHowClose").onclick = () => { $("scrHow").hidden = true; };
$("btnPause").onclick = pause; $("btnResume").onclick = resume; $("btnQuit").onclick = () => { if (G.softPause) { G.softPause = false; Portal.gameplayStop(); } toMenu(); };
$("btnNext").onclick = onNext; $("btnMenu").onclick = toMenu; $("btnContinue").onclick = onContinue;
$("btnFreeGrid").onclick = () => { if (G.state !== "gameOver" || G.freeGrids >= 1) return; Sound.unlock(); G.freeGrids++; G.score = G.levelStartScore; startLevel(); };
$("btnSkip").onclick = () => endLevel();
$("btnIt").onclick = () => { if (LANG !== "it") { Save.set("lang", "it"); setLang("it"); } };
$("btnEn").onclick = () => { if (LANG !== "en") { Save.set("lang", "en"); setLang("en"); } };
$("btnHint").onclick = useHint;
document.addEventListener("visibilitychange", () => {
  if (!document.hidden || G.state !== "play") return;
  G.dragging = false; G.path = []; G.pointer = null; renderPath();
  $("pauseText").textContent = G.mode === "zen" ? TEXTS.pauseZen : TEXTS.pauseText;
  G.softPause = true; setState("pause");     // niente gameplayStop: il portale lo vuole solo per pause vere
});
const relayout = () => { const was = Layout.land; layout(); if (was !== Layout.land) buildStatic(); };
window.addEventListener("resize", relayout);
window.addEventListener("orientationchange", () => setTimeout(relayout, 250));
try { if (window.visualViewport) visualViewport.addEventListener("resize", relayout); } catch (e) {}
try { new ResizeObserver(relayout).observe($("holder")); } catch (e) {}
// riserva: controllo la misura ogni mezzo secondo (alcuni iframe su telefono cambiano misura senza avvisare)
{ let lw = 0, lh = 0; setInterval(() => { const h = $("holder"); if (h.clientWidth !== lw || h.clientHeight !== lh) { lw = h.clientWidth; lh = h.clientHeight; relayout(); } }, 500); }

(async function boot() {
  setState("loading");
  layout();
  const fxReady = FX.init();
  await Portal.init();
  Sound.load();
  Wallet.load(); Amb.layout();
  initNeighbors();
  await setLang(initialLang());
  layout(); buildStatic();
  await fxReady;
  Portal.loadingDone();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
